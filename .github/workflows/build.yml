name: Build .deb

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper devscripts lintian

      - name: Build package
        run: dpkg-buildpackage -us -uc -b

      - name: Collect build output
        run: |
          mkdir -p dist
          mv ../jellyfin-wake-hdd_*_all.deb dist/

      - name: Run lintian
        run: lintian --no-tag-display-limit dist/*.deb || true

      - name: Upload .deb file
        uses: actions/upload-artifact@v4
        with:
          name: jellyfin-wake-hdd-deb
          path: dist/*.deb

      - name: Attach .deb to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
