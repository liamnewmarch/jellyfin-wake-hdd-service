# /etc/jellyfin-wake-hdd.conf
#
# Configuration for jellyfin-wake-hdd. This file is sourced by
# /usr/sbin/jellyfin-wake-hdd as a bash script, so values must use bash
# syntax (quoted strings, array literals).
#
# After editing this file, no restart is needed — jellyfin-wake-hdd.timer
# re-reads it on every run.

# Base URL of your Jellyfin server.
JELLYFIN_URL="http://localhost:8096"

# API key with access to /Sessions. Create one under Jellyfin's
# Dashboard -> API Keys.
JELLYFIN_API_KEY=""

# Paths on the drives to wake. The script reads one 4 KiB block from the
# block device backing each path, so each path must be on a local disk
# (not a FUSE or network mount). List one path per drive
# (or enclosure) you need to wake; a single path is enough if your drives
# share an enclosure that wakes all members together.
WAKE_PATHS=(
    # "/mnt/my-first-hdd/TV Shows"
    # "/mnt/my-other-hdd/Movies"
)

# Minimum number of Jellyfin sessions (including idle/connected-but-not-
# playing clients) required before drives are woken.
MIN_SESSIONS=1

# Timeout in seconds for the request to the Jellyfin API.
CURL_TIMEOUT=3
